name: Construire l'APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: mkdir -p www assets && cp index.html www/ && (cp icon-*.png assets/ || true)

      - run: npm install

      - run: npx cap add android

      - name: Icone de l'app
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - run: npx cap sync android

      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk NovaStore.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NovaStore-apk
          path: NovaStore.apk

